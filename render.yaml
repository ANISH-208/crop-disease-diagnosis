services:
  - type: web
    name: crop-doctor-api
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt && python scripts/check_model_artifact.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: crop-doctor-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CROP_DOCTOR_ALLOWED_ORIGINS
        value: https://crop-doctor-frontend.onrender.com
      - key: CROP_DOCTOR_UPLOAD_DIR
        value: /var/data/uploads
      - key: CROP_DOCTOR_DATABASE_PATH
        value: /var/data/alerts.db

  - type: web
    name: crop-doctor-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: crop-doctor-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
